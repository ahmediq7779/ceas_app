name: ceas
description: "Civil Engineering Application Suite (CEAS) - A production-ready engineering calculator & BOQ suite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Persistent Storage
  shared_preferences: ^2.2.3
  
  # PDF Generation & Printing
  pdf: ^3.10.8
  printing: ^5.12.0
  
  # Native Share
  share_plus: ^9.0.0
  
  # UI & Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
